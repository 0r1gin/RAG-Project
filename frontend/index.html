<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with your documents</title>

  <!-- Pico CSS from a CDN. Pin an exact version (e.g. @2.0.6) once you're happy with it. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <!-- Your overrides load AFTER Pico so they win -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>doc-chat</strong></li></ul>
      <ul><li><button id="theme-toggle" class="secondary outline">Dark mode</button></li></ul>
    </nav>
  </header>

  <main class="container">
    <hgroup>
      <h1>Chat with your documents</h1>
      <p>Ask a question. Answers come only from the indexed files.</p>
    </hgroup>

    <form id="ask-form">
      <fieldset role="group">
        <input id="question" type="text" placeholder="e.g. What are the two kinds of loops?"
               minlength="3" maxlength="500" required>
        <button id="ask-btn" type="submit">Ask</button>
      </fieldset>
    </form>

    <p id="status" role="status" hidden></p>

    <article id="result" hidden>
      <header>Answer</header>
      <p id="answer"></p>
      <footer><small>Sources: <span id="sources"></span></small></footer>
    </article>
  </main>

  <footer class="container">
    <small>Built with FastAPI, ChromaDB and Claude.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
