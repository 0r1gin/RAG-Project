<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with your documents</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="common.js"></script>
</head>
<body>
  <header class="container app-header">
    <nav>
      <ul>
        <li><strong>doc-chat</strong></li>
        <li><small id="kb-status" class="muted"></small></li>
      </ul>
      <ul>
        <li><button id="new-chat" type="button" class="secondary outline small">New chat</button></li>
        <li><button id="theme-toggle" type="button" class="secondary outline small"></button></li>
        <li><a href="/admin.html">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main class="container chat">
    <section id="messages" aria-live="polite" aria-label="Conversation">
      <div id="empty" class="empty">
        <h1>Ask your documents</h1>
        <p class="muted">Answers come only from the indexed files, with their sources.</p>
        <div id="suggestions" class="chips"></div>
      </div>
    </section>
  </main>

  <footer class="composer">
    <div class="container">
      <form id="ask-form">
        <textarea id="question" rows="1" maxlength="500"
                  placeholder="Ask a question…" aria-label="Your question"></textarea>
        <button type="submit" id="ask-btn">Send</button>
      </form>
      <small class="muted">
        Enter to send, Shift+Enter for a new line. Each question is answered on its own,
        with no memory of earlier ones.
      </small>
    </div>
  </footer>

  <!-- Pin exact versions. If these fail to load, answers fall back to plain text. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
